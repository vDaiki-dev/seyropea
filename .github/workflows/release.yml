name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  linux:
    name: Linux · AppImage + DEB
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Dependencias del sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev patchelf pkg-config build-essential
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: '1.100.0'
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: src-tauri
      - name: Instalar Tauri CLI
        run: cargo install tauri-cli --version '^2' --locked
      - name: Compilar paquetes
        run: cargo tauri build --bundles appimage,deb
      - name: Subir artefactos
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: linux
          if-no-files-found: error
          path: |
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/deb/*.deb

  windows:
    name: Windows · MSI + EXE (NSIS)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: '1.100.0'
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: src-tauri
      - name: Instalar Tauri CLI
        run: cargo install tauri-cli --version '^2' --locked
      - name: Compilar paquetes
        run: cargo tauri build --bundles msi,nsis
      - name: Subir artefactos
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows
          if-no-files-found: error
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe

  macos:
    name: macOS · DMG + APP
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: '1.100.0'
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: src-tauri
      - name: Instalar Tauri CLI
        run: cargo install tauri-cli --version '^2' --locked
      - name: Compilar paquetes
        run: cargo tauri build --bundles app,dmg
      - name: Empaquetar .app para descarga
        run: |
          APP=$(find src-tauri/target/release/bundle/macos -maxdepth 1 -name '*.app' | head -n 1)
          if [ -n "$APP" ]; then ditto -c -k --sequesterRsrc --keepParent "$APP" "${APP}.tar.gz"; fi
      - name: Subir artefactos
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: macos
          if-no-files-found: error
          path: |
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/macos/*.app.tar.gz

  publish:
    name: Publicar GitHub Release + SHA256
    needs: [linux, windows, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: artifacts
      - name: Generar SHA256SUMS.txt
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          wanted = ('.appimage', '.deb', '.msi', '.exe', '.dmg', '.gz')
          files = sorted(
              p for p in Path('artifacts').rglob('*')
              if p.is_file() and p.name.lower().endswith(wanted)
          )
          if not files:
              raise SystemExit('No se encontraron artefactos publicables')
          lines = []
          for p in files:
              digest = hashlib.sha256(p.read_bytes()).hexdigest()
              lines.append(f'{digest}  {p.name}')
          Path('SHA256SUMS.txt').write_text('\n'.join(lines) + '\n', encoding='utf-8')
          print('\n'.join(lines))
          PY
      - name: Crear Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          name: SeyroPea ${{ github.ref_name }}
          body_path: CHANGELOG.md
          draft: false
          prerelease: false
          files: |
            artifacts/**/*.AppImage
            artifacts/**/*.deb
            artifacts/**/*.msi
            artifacts/**/*.exe
            artifacts/**/*.dmg
            artifacts/**/*.app.tar.gz
            SHA256SUMS.txt
