[package]
name = "seyropea"
version = "0.1.0"
description = "Estudio profesional de edición de imágenes de escritorio, ligero y offline"
authors = ["vDaiki-dev"]
license = "GPL-3.0-only"
edition = "2021"
rust-version = "1.90"

[lib]
name = "seyropea_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.6", features = [] }

[dependencies]
tauri = { version = "2.12.7", features = [] }
tauri-plugin-dialog = "2.8.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
flate2 = "1"
dirs = "7"
ureq = { version = "3.5.2", default-features = false, features = ["rustls", "json", "gzip"] }
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "webp", "bmp", "tiff"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true
